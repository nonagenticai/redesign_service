apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: redesign-service-hpa
  labels:
    app: redesign-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: redesign-service
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
