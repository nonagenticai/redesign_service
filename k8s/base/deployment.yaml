apiVersion: apps/v1
kind: Deployment
metadata:
  name: redesign-service
  labels:
    app: redesign-service
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: redesign-service
  template:
    metadata:
      labels:
        app: redesign-service
        version: v1
    spec:
      containers:
        - name: redesign-service
          image: redesign-service:latest
          ports:
            - containerPort: 6306
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: redesign-service-config
            - secretRef:
                name: redesign-service-secrets
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 4Gi
          livenessProbe:
            httpGet:
              path: /health/live
              port: 6306
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 6306
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health/live
              port: 6306
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 18
          volumeMounts:
            - name: redesign-data
              mountPath: /app/data/redesign
      volumes:
        - name: redesign-data
          persistentVolumeClaim:
            claimName: redesign-service-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: redesign-service
  labels:
    app: redesign-service
spec:
  type: ClusterIP
  ports:
    - port: 6306
      targetPort: 6306
      protocol: TCP
      name: http
  selector:
    app: redesign-service
