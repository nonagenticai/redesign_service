apiVersion: v1
kind: ConfigMap
metadata:
  name: redesign-service-config
  labels:
    app: redesign-service
data:
  ENVIRONMENT: "production"
  APP_NAME: "Redesign Service"
  APP_VERSION: "0.1.0"

  # API
  API_HOST: "0.0.0.0"
  API_PORT: "6306"
  API_DEBUG: "false"

  # Auth
  AUTH_ENABLED: "true"

  # Storage
  STORAGE_BACKEND: "local"
  STORAGE_LOCAL_PATH: "/app/data"

  # Database pool
  POSTGRES_POOL_MIN_SIZE: "2"
  POSTGRES_POOL_MAX_SIZE: "10"
  POSTGRES_POOL_TIMEOUT: "30"
  POSTGRES_POOL_RECYCLE: "3600"

  # Redis
  REDIS_MAX_CONNECTIONS: "10"

  # Logging
  LOG_LEVEL: "WARNING"
  LOG_JSON_LOGS: "true"
