[project]
license = "Apache-2.0"
name = "redesign-service"
version = "0.1.0"
description = "AI-powered website redesign microservice with screenshot rendering"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[all]>=0.122.0",
    "uvicorn[standard]>=0.34.0",
    "psycopg[binary,pool]>=3.2.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.0",
    "redis>=5.2.0",
    "uuid-v7>=1.0.0,<2.0.0",
    "alembic>=1.14.0",
    "httpx>=0.27.0",
    "cachetools>=5.0.0",
    "jinja2>=3.1.0",
    "playwright>=1.40.0",
    "anthropic>=0.40.0",
    "beautifulsoup4>=4.12.0",
    "Pillow>=10.0.0",
]

[project.scripts]
redesign-service = "src.asgi:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-timeout>=2.3.1",
    "pytest-mock>=3.12.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-timeout>=2.3.1",
    "pytest-mock>=3.12.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-timeout>=2.3.1",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "ty>=0.0.15",
    "pip-audit>=2.7.0",
    "detect-secrets>=1.5.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/database/migrations/*" = ["I001"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "unit: unit tests",
    "integration: integration tests",
]

[tool.coverage.report]
fail_under = 80

[tool.ty.environment]
python-version = "3.12"

[tool.ty.rules]
unresolved-import = "ignore"
possibly-missing-attribute = "ignore"
unused-type-ignore-comment = "ignore"
invalid-argument-type = "ignore"
unsupported-operator = "ignore"
invalid-return-type = "ignore"
